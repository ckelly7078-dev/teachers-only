nd:#e2e8f0;border-radius:10px;overflow:hidden;display:flex;margin:14px 0}.bar span{height:100%;display:block}.master{background:var(--blue)}.fam{background:var(--gold)}.stats{display:flex;gap:25px;flex-wrap:wrap}.stats b{font-size:26px;display:block}.stats small{color:var(--muted)}.pill{font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.6px}.term{font-size:42px;font-weight:700;min-height:110px;display:grid;place-items:center;word-break:break-word}.star{background:transparent;color:#8492a5;font-size:27px;padding:4px 10px}.star.on{color:#b48614}.vrow{display:grid;grid-template-columns:1fr 1fr auto auto;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid #e6e9ef}.vrow:last-child{border:0}input,select{border:1px solid #bec9d8;border-radius:8px;padding:13px;font:inherit;color:var(--navy);background:white}input[type=text]{width:100%}label{display:block;font-weight:600;margin:14px 0 6px}select{max-width:100%}.opts{display:flex;gap:12px;flex-wrap:wrap}.answer{background:white;border:1px solid #bac7db;color:var(--navy);text-align:left;min-height:55px}.selected{background:#e9effa!important;border-color:#244c92!important}.correct{background:#e3f3e9!important;border-color:#318456!important;color:#246241!important}.wrong{background:#fae8e6!important;border-color:#c2544b!important;color:#a13e37!important}.feedback{padding:14px;border-radius:8px;margin:12px 0}.roundbar{display:flex;gap:5px;margin:12px 0}.roundbar span{flex:1;height:7px;border-radius:4px;background:#dce3ee}.roundbar span.done{background:var(--blue)}.right{text-align:right}.hidden{display:none}.center{text-align:center}.badge{font-size:12px;padding:5px 8px;border-radius:5px;background:#edf1f8;white-space:nowrap}.badge.m{background:#e3edff;color:#244c92}.badge.f{background:#fff2c3;color:#78570b}.big{font-size:52px;font-weight:800;color:var(--blue)}@media(max-width:600px){.grid{grid-template-columns:1fr}.grid.two{grid-template-columns:1fr 1fr}header small{display:none}main{padding:20px 14px}h1{font-size:29px}.card{padding:17px}.term{font-size:35px}.vrow{grid-template-columns:1fr 1fr auto}.vrow .badge{display:none}}.map-section{margin-top:28px}.map-section h2{font-size:19px;margin-bottom:12px}.map-notice{margin:18px 0;background:#e8edf7;border-left:3px solid var(--blue);padding:13px 16px;border-radius:6px;color:#415675;font-size:14px}.staff-tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:22px 44px 22px 22px;min-height:142px;font-size:20px}.staff-tile small{margin-top:0}.module-icon{width:27px;height:27px;color:var(--blue)}.tile-arrow{position:absolute;right:18px;top:22px;color:var(--blue);font-size:20px}.workflow{display:flex;gap:10px;flex-wrap:wrap}.workflow>div{flex:1 1 130px;display:flex;gap:8px;align-items:center;background:#f3f5f9;border-radius:8px;padding:12px;font-size:14px}.workflow b{display:grid;place-items:center;flex:0 0 25px;height:25px;border-radius:50%;background:var(--blue);color:white}.map-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 18px;margin-bottom:20px}.map-field:has(textarea),.map-field:has(input[type=file]){grid-column:1/-1}.map-field input,.map-field select,.map-field textarea{width:100%;max-width:100%;font:inherit}.map-field textarea{border:1px solid #bec9d8;border-radius:8px;padding:13px;resize:vertical;color:var(--navy)}.map-output{display:flex;align-items:center;justify-content:space-between;padding:14px 0;gap:10px;border-bottom:1px solid #e2e8f0}.map-output:last-child{border-bottom:0}.map-output span{font-size:12px;color:var(--muted)}.map-table{border-collapse:collapse;width:100%;margin-top:16px;font-size:14px}.map-table th,.map-table td{border-bottom:1px solid #e2e8f0;text-align:left;padding:10px 6px}.map-table thead{background:#e9effa}.comparison{overflow:auto}@media(max-width:600px){.map-fields{grid-template-columns:1fr}.staff-tile{font-size:16px;padding:16px;min-height:150px}.tile-arrow{display:none}}.demo-profile{display:flex;align-items:center;gap:16px;margin:0 0 18px}.demo-profile img{width:80px;height:80px;object-fit:cover;border-radius:50%;border:3px solid #e9c34b;flex:none}.student-avatar{width:80px;height:80px;display:grid;place-items:center;border:3px solid var(--gold);border-radius:50%;background:var(--navy);color:white;font-weight:700;font-size:24px;flex:none}.demo-profile.compact .student-avatar{width:48px;height:48px;font-size:16px}.demo-profile strong{display:block;font-size:1.25rem}.demo-profile small{color:#64748b}.demo-profile.compact img{width:48px;height:48px}.demo-profile.compact{margin:12px 0 24px}@media(max-width:600px){.grid.two{grid-template-columns:1fr}} .role-choice{max-width:480px;margin-top:24px}.role-choice .tile{width:100%}.demo-profile img{object-fit:contain;background:#14284b}.page-note{font-size:13px;color:var(--muted);margin:24px 0}textarea:focus-visible{outline:3px solid #ca971c;outline-offset:3px}</style></head><body><header><b>St Columb's College</b><small id="workspace-label">Teacher portal</small></header><main id="app"></main><script>
let view='role';
const $=()=>document.getElementById('app');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function btn(s,fn,cls=''){return `<button class="${cls}" onclick="${fn}">${esc(s)}</button>`}
function title(s,d=''){return `<h1>${esc(s)}</h1><p>${esc(d)}</p>`}
function go(v){if(!['role','staffsignin','staffhome'].includes(v)&&!(v.startsWith('staff:')&&Object.hasOwn(staffModules,v.slice(6))))return;view=v;render();window.scrollTo(0,0)}

else if(view==='staffhome'){html=staffNav()+title('Teacher dashboard','Welcome, Mr Stephenson.')+teacherProfile(true)+`<div class="map-notice">Site map preview · School records, approvals and live staff workflows will be connected later.</div>`+staffGroups.map(([heading,items])=>`<section class="map-section"><h2>${heading}</h2><div class="grid two">${items.map(staffTile).join('')}</div></section>`).join('');}
else{const id=view.slice(6),m=staffModules[id];html=staffNav()+teacherProfile(true)+title(m.name,m.desc)+`<div class="map-notice">Module preview · ${esc(m.status)}.</div><div class="card"><h2>Planned workflow</h2><div class="workflow">${m.steps.map((s,i)=>`<div><b>${i+1}</b><span>${esc(s)}</span></div>`).join('')}</div></div>`;
if(m.fields.length)html+=`<div class="card"><h2>${id==='marking'?'Assessment setup':id==='cover'?'Lesson details':id==='practical'?'Practical details':'Workspace preview'}</h2><p>Explore the form with fictional data only. Nothing is submitted or stored.</p><div class="map-fields">${m.fields.map(staffField).join('')}</div><div class="opts">${btn('Preview workflow',"previewWorkflow()")}${btn('Back to workspace',"go('staffhome')",'secondary')}</div><p class="hidden" id="map-preview" role="status">This is the planned workflow. No files have been sent, no records changed and no AI action has been run.</p></div>`;
if(m.outputs.length)html+=`<div class="card"><h2>Planned outputs</h2>${m.outputs.map(x=>`<div class="map-output">${esc(x)}<span>Planned</span></div>`).join('')}</div>`;}
$().innerHTML=html;
}
render();
</script></body></html>
