nd:#e2e8f0;border-radius:10px;overflow:hidden;display:flex;margin:14px 0}.bar span{height:100%;display:block}.master{background:var(--blue)}.fam{background:var(--gold)}.stats{display:flex;gap:25px;flex-wrap:wrap}.stats b{font-size:26px;display:block}.stats small{color:var(--muted)}.pill{font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.6px}.term{font-size:42px;font-weight:700;min-height:110px;display:grid;place-items:center;word-break:break-word}.star{background:transparent;color:#8492a5;font-size:27px;padding:4px 10px}.star.on{color:#b48614}.vrow{display:grid;grid-template-columns:1fr 1fr auto auto;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid #e6e9ef}.vrow:last-child{border:0}input,select{border:1px solid #bec9d8;border-radius:8px;padding:13px;font:inherit;color:var(--navy);background:white}input[type=text]{width:100%}label{display:block;font-weight:600;margin:14px 0 6px}select{max-width:100%}.opts{display:flex;gap:12px;flex-wrap:wrap}.answer{background:white;border:1px solid #bac7db;color:var(--navy);text-align:left;min-height:55px}.selected{background:#e9effa!important;border-color:#244c92!important}.correct{background:#e3f3e9!important;border-color:#318456!important;color:#246241!important}.wrong{background:#fae8e6!important;border-color:#c2544b!important;color:#a13e37!important}.feedback{padding:14px;border-radius:8px;margin:12px 0}.roundbar{display:flex;gap:5px;margin:12px 0}.roundbar span{flex:1;height:7px;border-radius:4px;background:#dce3ee}.roundbar span.done{background:var(--blue)}.right{text-align:right}.hidden{display:none}.center{text-align:center}.badge{font-size:12px;padding:5px 8px;border-radius:5px;background:#edf1f8;white-space:nowrap}.badge.m{background:#e3edff;color:#244c92}.badge.f{background:#fff2c3;color:#78570b}.big{font-size:52px;font-weight:800;color:var(--blue)}@media(max-width:600px){.grid{grid-template-columns:1fr}.grid.two{grid-template-columns:1fr 1fr}header small{display:none}main{padding:20px 14px}h1{font-size:29px}.card{padding:17px}.term{font-size:35px}.vrow{grid-template-columns:1fr 1fr auto}.vrow .badge{display:none}}.map-section{margin-top:28px}.map-section h2{font-size:19px;margin-bottom:12px}.map-notice{margin:18px 0;background:#e8edf7;border-left:3px solid var(--blue);padding:13px 16px;border-radius:6px;color:#415675;font-size:14px}.staff-tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:22px 44px 22px 22px;min-height:142px;font-size:20px}.staff-tile small{margin-top:0}.module-icon{width:27px;height:27px;color:var(--blue)}.tile-arrow{position:absolute;right:18px;top:22px;color:var(--blue);font-size:20px}.workflow{display:flex;gap:10px;flex-wrap:wrap}.workflow>div{flex:1 1 130px;display:flex;gap:8px;align-items:center;background:#f3f5f9;border-radius:8px;padding:12px;font-size:14px}.workflow b{display:grid;place-items:center;flex:0 0 25px;height:25px;border-radius:50%;background:var(--blue);color:white}.map-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 18px;margin-bottom:20px}.map-field:has(textarea),.map-field:has(input[type=file]){grid-column:1/-1}.map-field input,.map-field select,.map-field textarea{width:100%;max-width:100%;font:inherit}.map-field textarea{border:1px solid #bec9d8;border-radius:8px;padding:13px;resize:vertical;color:var(--navy)}.map-output{display:flex;align-items:center;justify-content:space-between;padding:14px 0;gap:10px;border-bottom:1px solid #e2e8f0}.map-output:last-child{border-bottom:0}.map-output span{font-size:12px;color:var(--muted)}.map-table{border-collapse:collapse;width:100%;margin-top:16px;font-size:14px}.map-table th,.map-table td{border-bottom:1px solid #e2e8f0;text-align:left;padding:10px 6px}.map-table thead{background:#e9effa}.comparison{overflow:auto}@media(max-width:600px){.map-fields{grid-template-columns:1fr}.staff-tile{font-size:16px;padding:16px;min-height:150px}.tile-arrow{display:none}}.demo-profile{d g:13px;font:inherit;color:var(--navy);resize:vertical;margin-bottom:12px}.card .map-fields input,.card .map-fields select{width:100%;min-width:0}.map-table select{min-width:135px}.map-table th{white-space:nowrap}@media(max-width:700px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.metric{padding:14px}.metric strong{font-size:26px}}</style></head><body><header><b>St Columb's College</b><small id="workspace-label">Teacher portal</small></header><main id="app"></main><script>
let view='role';
const $=()=>document.getElementById('app');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function btn(s,fn,cls=''){return `<button class="${cls}" onclick="${fn}">${esc(s)}</button>`}
function title(s,d=''){return `<h1>${esc(s)}</h1><p>${esc(d)}</p>`}
function go(v){if(!['role','staffsignin','staffhome'].includes(v)&&!(v.startsWith('staff:')&&Object.hasOwn(staffModules,v.slice(6))))return;view=v;notice='';render();window.scrollTo(0,0)}

function teacherProfile(compact=false){return `<div class="demo-profile${compact?' compact':''}"><img src="${teacherPortrait}" alt="Cowboy illustration for the teacher demo account"><div><strong>Mr Stephenson</strong><small>Teacher · Demo account</small></div></div>`}
function staffNav(){return `<nav class="staff-nav">${btn('Role selection',"go('role')",'ghost')}${view==='staffsignin'?'':' / '+btn('Teacher workspace',"go('staffhome')",'ghost')}</nav>`}
function previewWorkflow(){const note=document.getElementById('map-preview');note.classList.remove('hidden');note.scrollIntoView({behavior:'smooth',block:'nearest'})}

const STORE='scc-teacher-workspace-v1';const STATUSES=['Not started','In progress','Completed'];const RESOURCE_TYPES=['Vocabulary set','Practice worksheet','Revision material','Lesson activity'];let notice='',storageNotice='',selectedClass=null;let data=loadData();
function freshData(){return {next:13,classes:[{id:1,name:"Year 11A",subject:"Mathematics",pupils:[{id:4,name:"Student A"},{id:5,name:"Student B"},{id:6,name:"Student C"},{id:7,name:"Student D"}]},{id:2,name:"Year 11B",subject:"Mathematics",pupils:[{id:8,name:"Student E"},{id:9,name:"Student F"}]},{id:3,name:"Year 10C",subject:"Spanish",pupils:[{id:10,name:"Student G"},{id:11,name:"Student H"}]}],resources:[{id:12,title:"Percentage practice",subject:"Mathematics",type:"Practice worksheet",instructions:"1. Find 15% of 80.\n2. Increase £40 by 10%.\n3. Explain your method."}],assignments:[{id:13,classId:1,title:"Percentage practice",resourceId:12,due:"",records:{4:{status:"Completed",score:80},5:{status:"Completed",score:65},6:{status:"In progress",score:null},7:{status:"Not started",score:null}}}]};}
function loadData(){try{const raw=localStorage.getItem(STORE);if(raw){const d=JSON.parse(raw);if(d&&Number.isInteger(d.next)&&Array.isArray(d.classes)&&Array.isArray(d.resources)&&Array.isArray(d.assignments))return d;}}catch(e){storageNotice="Browser storage unavailable. Changes may be lost on refresh."}return freshData()}
function persist(){try{localStorage.setItem(STORE,JSON.stringify(data));storageNotice=""}catch(e){storageNotice="Browser storage unavailable. Changes may be lost on refresh."}}
function change(message){persist();notice=message;render()}
function nextId(){return ++data.next}
function currentClass(){return data.classes.find(c=>c.id===selectedClass)||data.classes[0]||null}
function assignmentFor(id){return data.assignments.find(a=>a.id===id)}
function recordFor(a,id){return a.records[id]||{status:"Not started",score:null}}
function classAssignments(c){return data.assignments.filter(a=>a.classId===c.id)}
function statsFor(classes){let total=0,done=0,marked=0,sum=0;for(const c of classes)for(const a of classAssignments(c))for(const p of c.pupils){const r=recordFor(a,p.id);total++;if(r.status==="Completed")done++;if(r.score!==null&&Number.isFinite(r.score)){marked++;sum+=r.score}}return {total,done,marked,average:marked?Math.round(sum/marked):null,rate:total?Math.round(done/total*100):null}}
function metric(label,value,detail){return `<div class="metric"><small>${esc(label)}</small><strong>${esc(value)}</strong><span>${esc(detail)}</span></div>`}
function dashboardOverview(){const v=statsFor(data.classes);return `<div class="map-notice">Local demo · Use fictional data only. No information is sent to the school.</div>${statusHTML()}<section class="metrics">${metric("Classes",data.classes.length,"Teaching groups")}${metric("Learners",data.classes.reduce((n,c)=>n+c.pupils.length,0),"Fictional records")}${metric("Assignments",data.assignments.length,"Created locally")}${metric("Completion",v.rate===null?"—":v.rate+"%",v.done+" of "+v.total+" learner tasks")}</section><section class="card quick-start"><div><h2>Your teaching workspace</h2><p>Manage your classes, create resources and record learner progress from one place.</p></div><div class="opts">${btn("Open my classes","go('staff:classes')")}${btn("Create a resource","go('staff:resources')","secondary")}</div></section>`}
function statusHTML(){return `<div role="status" aria-live="polite">${notice?`<p class="saved-note">${esc(notice)}</p>`:""}${storageNotice?`<p class="map-notice">${esc(storageNotice)}</p>`:""}</div>`}
function classOptions(sel){return data.classes.map(c=>`<option value="${c.id}" ${c.id===sel?"selected":""}>${esc(c.name)} · ${esc(c.subject)}</option>`).join("")}
function classSelect(id){return `<label for="${id}">Teaching group</label><select id="${id}" onchange="selectClass(Number(this.value))">${classOptions(currentClass()?.id)}</select>`}
function selectClass(id){if(data.classes.some(c=>c.id===id)){selectedClass=id;notice="";render()}}
function addClass(name,subject){name=String(name||"").trim();subject=String(subject||"").trim();if(!name||!subject||name.length>60||subject.length>60)return false;if(data.classes.some(c=>c.name.toLowerCase()===name.toLowerCase()&&c.subject.toLowerCase()===subject.toLowerCase()))return false;const c={id:nextId(),name,subject,pupils:[]};data.classes.push(c);selectedClass=c.id;return true}
function addPupil(classId,name){const c=data.classes.find(x=>x.id===classId);name=String(name||"").trim();if(!c||!name||name.length>60||c.pupils.some(p=>p.name.toLowerCase()===name.toLowerCase()))return false;c.pupils.push({id:nextId(),name});return true}
function addAssignment(classId,title,due,resourceId=null){const c=data.classes.find(x=>x.id===classId);title=String(title||"").trim();due=String(due||"");if(!c||!title||title.length>100||(due&&!/^\d{4}-\d{2}-\d{2}$/.test(due))||(resourceId!==null&&!data.resources.some(r=>r.id===resourceId)))return false;data.assignments.push({id:nextId(),classId,title,due,resourceId,records:{}});return true}
function updateRecord(assignmentId,pupilId,status,score){const a=assignmentFor(assignmentId),c=a&&data.classes.find(x=>x.id===a.classId);if(!c||!c.pupils.some(p=>p.id===pupilId)||!STATUSES.includes(status)||(score!==null&&(!Number.isFinite(score)||score<0||score>100)))return false;a.records[pupilId]={status,score};return true}
function fieldValue(id){return document.getElementById(id)?.value||""}
function submitClass(e){e.preventDefault();if(addClass(fieldValue("class-name"),fieldValue("class-subject")))change("Teaching group created.");else{notice="Enter a unique group name and subject.";render()}}
function submitPupil(e){e.preventDefault();if(addPupil(currentClass()?.id,fieldValue("pupil-name")))change("Fictional learner added.");else{notice="Enter a unique fictional learner label.";render()}}
function submitAssignment(e){e.preventDefault();if(addAssignment(currentClass()?.id,fieldValue("assignment-title"),fieldValue("assignment-due")))change("Assignment created in this class.");else{notice="Enter a valid assignment title and date.";render()}}
function saveRecord(aid,pid){const st=fieldValue("status-"+aid+"-"+pid),raw=fieldValue("score-"+aid+"-"+pid);if(updateRecord(aid,pid,st,raw===""?null:Number(raw)))change("Progress saved.");else{notice="Score must be blank or a number between 0 and 100.";render()}}
function learnerRows(c,a){if(!c.pupils.length)return "<p>Add fictional learners to record progress.</p>";return `<div class="comparison"><table class="map-table"><thead><tr><th>Learner</th><th>Completion</th><th>Score (%)</th><th></th></tr></thead><tbody>${c.pupils.map(p=>{const r=recordFor(a,p.id),k=a.id+"-"+p.id;return `<tr><td>${esc(p.name)}</td><td><select aria-label="Completion for ${esc(p.name)}" id="status-${k}">${STATUSES.map(t=>`<option ${t===r.status?"selected":""}>${t}</option>`).join("")}</select></td><td><input class="score-input" aria-label="Score for ${esc(p.name)}" type="number" min="0" max="100" step="any" id="score-${k}" value="${r.score??""}"></td><td>${btn("Save",`saveRecord(${a.id},${p.id})`,"secondary")}</td></tr>`}).join("")}</tbody></table></div>`}
function classesHTML(){const c=currentClass(),v=c?statsFor([c]):null;return staffNav()+title("My classes","Manage teaching groups, assignments and recorded learning progress.")+statusHTML()+`<div class="map-notice">Fictional demo records only. Data stays in this browser; there is no live school roster or student delivery.</div><section class="card"><h2>Teaching groups</h2>${c?classSelect("active-class"):"<p>No classes yet.</p>"}<details><summary>Create a teaching group</summary><form onsubmit="submitClass(event)"><div class="map-fields"><div><label for="class-name">Group name</label><input id="class-name" required maxlength="60" placeholder="Year 12A"></div><div><label for="class-subject">Subject</label><input id="class-subject" required maxlength="60" placeholder="Physics"></div></div><button type="submit">Create class</button></form></details></section>`+(c?`<section class="metrics">${metric("Learners",c.pupils.length,"In "+c.name)}${metric("Assignments",classAssignments(c).length,"Local records")}${metric("Completion",v.rate===null?"—":v.rate+"%",v.done+" of "+v.total+" tasks")}${metric("Mean score",v.average===null?"—":v.average+"%",v.marked+" recorded scores")}</section><section class="card"><h2>Class roster</h2>${c.pupils.length?`<div class="roster">${c.pupils.map(p=>`<span>${esc(p.name)}</span>`).join("")}</div>`:"<p>No learners yet.</p>"}<form onsubmit="submitPupil(event)"><label for="pupil-name">Fictional learner label</label><div class="inline-form"><input id="pupil-name" required maxlength="60" placeholder="Student I"><button type="submit">Add learner</button></div></form></section><section class="card"><h2>New assignment</h2><form onsubmit="submitAssignment(event)"><div class="map-fields"><div><label for="assignment-title">Title</label><input id="assignment-title" required maxlength="100"></div><div><label for="assignment-due">Due date (optional)</label><input id="assignment-due" type="date"></div></div><button type="submit">Create assignment</button></form></section><h2>Assignments and progress</h2>${classAssignments(c).map(a=>`<section class="card"><div class="line"><h2>${esc(a.title)}</h2><span class="badge">${esc(a.due||"No due date")}</span></div>${a.resourceId?`<p>Linked resource: ${esc(data.resources.find(r=>r.id===a.resourceId)?.title||"Unavailable")}</p>`:""}${learnerRows(c,a)}</section>`).join("")||"<p>No assignments yet.</p>"}`:"")+btn("Back to workspace","go('staffhome')","secondary")}
function addResource(title,subject,type,instructions){title=String(title||"").trim();subject=String(subject||"").trim();instructions=String(instructions||"").trim();if(!title||title.length>100||!subject||subject.length>60||!RESOURCE_TYPES.includes(type)||!instructions||instructions.length>10000)return false;data.resources.push({id:nextId(),title,subject,type,instructions});return true}
function submitResource(e){e.preventDefault();if(addResource(fieldValue("resource-title"),fieldValue("resource-subject"),fieldValue("resource-type"),fieldValue("resource-content")))change("Resource saved to your local library.");else{notice="Complete all resource fields.";render()}}
function assignResource(e,id){e.preventDefault();const r=data.resources.find(x=>x.id===id);if(r&&addAssignment(Number(fieldValue("resource-class-"+id)),r.title,fieldValue("resource-due-"+id),id))change("Resource linked to a local class assignment. Nothing was sent to students.");else{notice="Choose a valid class.";render()}}
function resourcesHTML(){return staffNav()+title("Learning resources","Build reusable teaching materials and link them to your classes.")+statusHTML()+`<div class="map-notice">Local resource library. No AI generation or student publishing is connected.</div><section class="card"><h2>Create a resource</h2><form onsubmit="submitResource(event)"><div class="map-fields"><div><label for="resource-title">Title</label><input id="resource-title" required maxlength="100"></div><div><label for="resource-subject">Subject</label><input id="resource-subject" required maxlength="60"></div><div><label for="resource-type">Type</label><select id="resource-type">${RESOURCE_TYPES.map(t=>`<option>${t}</option>`).join("")}</select></div></div><label for="resource-content">Instructions and content</label><textarea id="resource-content" rows="6" required maxlength="10000" placeholder="Write the learning activity or questions here."></textarea><div class="opts"><button type="submit">Save resource</button></div></form></section><h2>Resource library (${data.resources.length})</h2>${data.resources.map(r=>`<section class="card"><div class="line"><h2>${esc(r.title)}</h2><span class="badge">${esc(r.type)}</span></div><p>${esc(r.subject)}</p><div class="resource-text">${esc(r.instructions)}</div>${data.classes.length?`<form onsubmit="assignResource(event,${r.id})"><div class="map-fields"><div><label for="resource-class-${r.id}">Assign to class</label><select id="resource-class-${r.id}">${classOptions(currentClass()?.id)}</select></div><div><label for="resource-due-${r.id}">Due date (optional)</label><input type="date" id="resource-due-${r.id}"></div></div><button type="submit">Create class assignment</button></form>`:"<p>Create a class first to assign this resource.</p>"}</section>`).join("")||"<p>No resources yet.</p>"}`+btn("Back to workspace","go('staffhome')","secondary")}
function render(){document.getElementById('workspace-label').textContent='Teacher portal';let html='';
if(view==='role'){html=title('Choose your role','Select your role to continue')+`<div class="role-choice"><button class="tile staff-tile" onclick="go('staffsignin')">${staffIcon('users')}<span>Teacher</span><small>Classes, assessment and lesson preparation</small><span class="tile-arrow" aria-hidden="true">→</span></button></div><p class="page-note">Teacher-only demonstration · No real school credentials required.</p>`;}
else if(view==='staffsignin'){html=staffNav()+title('Teacher sign-in','Explore the teacher workspace using a demo account.')+`<div class="card"><h2>Demo access</h2>${teacherProfile()}<p>No real school credentials needed.</p>${btn('Continue as Mr Stephenson',"go('staffhome')")}</div>`;}
else if(view==='staffhome'){html=staffNav()+title('Teacher dashboard','Welcome, Mr Stephenson.')+teacherProfile(true)+`<section class="card"><h2>Curriculum Knowledge Base</h2><p>Search CCEA Foundation Mathematics records and prepare source-grounded practice.</p><a href="foundation/web/index.html">Open the knowledge base</a></section>`+dashboardOverview()+staffGroups.map(([heading,items])=>`<section class="map-section"><h2>${heading}</h2><div class="grid two">${items.map(staffTile).join('')}</div></section>`).join('');}
else if(view==='staff:classes'){html=classesHTML();}else if(view==='staff:resources'){html=resourcesHTML();}else{const id=view.slice(6),m=staffModules[id];html=staffNav()+teacherProfile(true)+title(m.name,m.desc)+`<div class="map-notice">Module preview · ${esc(m.status)}.</div><div class="card"><h2>Planned workflow</h2><div class="workflow">${m.steps.map((s,i)=>`<div><b>${i+1}</b><span>${esc(s)}</span></div>`).join('')}</div></div>`;
if(m.fields.length)html+=`<div class="card"><h2>${id==='marking'?'Assessment setup':id==='cover'?'Lesson details':id==='practical'?'Practical details':'Workspace preview'}</h2><p>Explore the form with fictional data only. Nothing is submitted or stored.</p><div class="map-fields">${m.fields.map(staffField).join('')}</div><div class="opts">${btn('Preview workflow',"previewWorkflow()")}${btn('Back to workspace',"go('staffhome')",'secondary')}</div><p class="hidden" id="map-preview" role="status">This is the planned workflow. No files have been sent, no records changed and no AI action has been run.</p></div>`;
if(m.outputs.length)html+=`<div class="card"><h2>Planned outputs</h2>${m.outputs.map(x=>`<div class="map-output">${esc(x)}<span>Planned</span></div>`).join('')}</div>`;}
$().innerHTML=html;
}
render();
</script></body></html>
